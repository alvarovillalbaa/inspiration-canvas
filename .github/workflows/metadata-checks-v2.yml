# TEMPORARY QA ACTIVATION. Root binds SOURCE_COMMIT to the reviewed source preparation.
# Attempts 1 and 2 retain their failures and retirement; this is attempt 3 only.
# Add the active copy only to the owned QA activation commit, never main HEAD.
name: Temporary metadata combobox acceptance v2
on:
  create:
permissions:
  contents: read
jobs:
  metadata:
    if: github.repository == 'alvarovillalbaa/inspiration-canvas' && github.event.repository.private == false && github.event.ref_type == 'branch' && github.event.ref == 'qa/metadata-combobox-20261105-3' && github.ref == 'refs/heads/qa/metadata-combobox-20261105-3'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_COMMIT: 59f29ac3cf51ae4030290e83b121ec2165728cb2
      METADATA_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
      METADATA_CREATED_REF_TYPE: ${{ github.event.ref_type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # reviewed v7.0.1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # reviewed v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Run the exact eight authored scenarios with source and cleanup guards
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          node tests/scripts/run-metadata-checks.mjs --source-commit "$SOURCE_COMMIT"
