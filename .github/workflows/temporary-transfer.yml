# Inactive template. Bind SOURCE_COMMIT before creating the one owned QA branch.
name: Temporary canvas transfer checks
on:
  create:
permissions:
  contents: read
jobs:
  transfer:
    if: github.repository == 'alvarovillalbaa/inspiration-canvas' && github.event.repository.private == false && github.event.ref_type == 'branch' && github.event.ref == 'qa/temporary-transfer-20261106' && github.ref == 'refs/heads/qa/temporary-transfer-20261106'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_COMMIT: 6244adbbf8b911c69d74f79c4a8a7ede499c7706
      TRANSFER_PUBLIC_REPOSITORY: ${{ github.event.repository.private == false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Check authored transfers, scoped types and lint
        run: python3 tests/scripts/run-transfer-checks.py
